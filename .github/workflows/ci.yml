name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials:false is kept after the private-dependency machinery went away
      # (@qojsxe7s). It was load-bearing then, because the extraheader checkout writes beat the
      # credentials an insteadOf rewrite embedded in the URL; it is ordinary hygiene now, and a
      # job that resolves a fully public closure has no reason to leave a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
          enable-cache: true
      # --frozen fails rather than silently updating uv.lock, so a dependency that drifted from
      # the lockfile is a red build instead of an image nobody can reproduce.
      - name: Sync dependencies
        run: uv sync --frozen
      # tests/test_deploy_proxy.py runs the deploy kit's Caddyfile through a real Caddy (@9y806dye)
      # and fails under CI without one. Pinned by version and SHA-512, the release's own checksum,
      # and 2.11.4 because that is the version the deployment's Caddy numbers were measured on.
      - name: Install Caddy
        env:
          CADDY_VERSION: 2.11.4
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/$tarball"
          echo "$CADDY_SHA512  $RUNNER_TEMP/$tarball" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" caddy
          echo "CADDY=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
