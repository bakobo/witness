name: Image

# Builds the witness image, proves it works, and publishes it to GHCR (@lypmcw7f, @lnk24kwp).
#
# The image is built HERE rather than in the deployment repository because this repo owns the keripy pin, so
# building anywhere else lets the image and the pin drift — the exact problem containerizing is
# meant to close. The deployment consumes an immutable digest, which the summary below surfaces.
#
# Deliberately uses no docker/* actions. Everything is `docker buildx` and `gh api` in shell,
# which means fewer third-party actions to pin and audit, and no dependency on an action whose
# runtime has been deprecated. checkout and setup-uv carry the same SHAs as ci.yml; the signing
# job adds actions/attest, GitHub's own, and fetches cosign and syft in shell against a pinned
# sha256 rather than through a third-party installer action (@4dx8zyjr).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # persist-credentials:false — see the note in ci.yml. Hygiene now rather than load-bearing,
      # since the closure went fully public (@qojsxe7s).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Interpolation happens here, into env, rather than inside a run: body, so nothing from the
      # event can be spliced into a shell command.
      - name: Resolve image name and tags
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/witness"
          # sha-<full-commit> on every build: the audit trail from an image back to the tree that
          # holds the keripy pin. A release tag adds its semver. No `latest`, ever — a floating
          # tag is precisely the drift @lnk24kwp exists to make unavailable.
          tags="sha-${SHA}"
          if [[ "${REF}" == refs/tags/v* ]]; then
            tags="${tags} ${REF#refs/tags/}"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "primary=${image}:sha-${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          PRIMARY: ${{ steps.names.outputs.primary }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --load puts the result in the local daemon so the oracle below can actually run it.
          docker buildx build \
            --build-arg "SOURCE_REVISION=${SHA}" \
            --load \
            -t "${PRIMARY}" \
            .

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
          enable-cache: true

      # --frozen fails rather than silently updating uv.lock, so a dependency that drifted from
      # the lockfile is a red build instead of an image nobody can reproduce.
      - name: Sync dependencies
        run: uv sync --frozen

      # ci.yml runs the same suite, but it runs in PARALLEL with this workflow and nothing
      # depends on it — so without this step a commit whose unit tests fail can still publish a
      # GHCR image, provided the image oracle passes. The oracle exercises the container, not the
      # suite, so it would. Running the gated suite here is the gate.
      - name: Run the unit suite (100% branch-coverage gate)
        run: uv run pytest

      # The oracle that would actually have caught something. Beyond "it builds and answers
      # health", it asserts the control plane's LMDB reader is REGISTERED in the lock table
      # (@v27j7uvo): an unregistered reader opens, answers, and returns wrong data only when the
      # witness happens to be recycling pages, so every cheaper check passes on a broken image.
      # Every oracle, named explicitly rather than by a glob: a file that stops being collected
      # because its name drifted would fail silently, and these are the only tests that touch the
      # artifact this workflow is about to publish. The pool oracle (@n2bgpdds) belongs here for
      # the same reason as the others — it is the only thing that proves the config a pool seeds
      # into a volume is a config the image's keripy actually reads.
      # DEPLOYED_WITNESS_IMAGE is the digest the estate is currently running, set as a repository
      # variable and updated when the deployment bumps its pin (@ktljhcyt). With it, the upgrade
      # oracle drives a real two-version handover: that digest writes the volume and this build
      # takes it over, and back again. Without it those two tests SKIP rather than falling back to
      # this image as its own baseline, which would prove container replacement while reading as
      # version compatibility.
      #
      # The step says which case it is in, because a skip is easy to miss in a log and "we did not
      # test the upgrade" is exactly the thing that should not pass quietly.
      - name: Run the image oracle
        env:
          WITNESS_IMAGE: ${{ steps.names.outputs.primary }}
          WITNESS_BASELINE_IMAGE: ${{ vars.DEPLOYED_WITNESS_IMAGE }}
        run: |
          set -euo pipefail
          if [ -n "${WITNESS_BASELINE_IMAGE}" ]; then
            echo "::notice::upgrade oracle baseline: ${WITNESS_BASELINE_IMAGE}"
            docker pull --quiet "${WITNESS_BASELINE_IMAGE}"
          else
            echo "::warning::DEPLOYED_WITNESS_IMAGE is unset, so the two-version handover did not run — this build is not proven against the digest production is running."
          fi
          uv run pytest tests/test_image_smoke.py tests/test_image_upgrade.py \
            tests/test_pool_oracle.py -v --no-cov

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Push and report the digest
        id: push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          PRIMARY: ${{ steps.names.outputs.primary }}
          TAGS: ${{ steps.names.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            docker tag "${PRIMARY}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${PRIMARY}")"
          # The bare sha256:<hex>, which is what the signing job binds everything to.
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          # Production deploys by digest, never by tag, so the digest is the output that matters.
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${digest}"
            echo '```'
            echo
            echo "Tags: ${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs and attests the digest the image job pushed (@4dx8zyjr). A job of its own so that
  # `id-token: write` -- the power to mint a certificate in this repo's name -- never sits on a job
  # that runs the test suite and therefore every dependency's code, and never on a pull request.
  sign:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # Pinned by sha256 here, the shell form of pinning an action by commit. To move a pin, take
      # the hash from the release's checksums file after verifying that file's own signature.
      - name: Install cosign and syft
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  cosign" | sha256sum --check --strict
          install -m 0755 cosign "${bin}/cosign"
          curl -fsSLo syft.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
          install -m 0755 syft "${bin}/syft"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Sign the digest
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # The deploy gate, run here against the digest just signed, with the exact identity of this
      # run's own ref. docs/deploying.md gives deployers the same command narrowed to v* tags, and
      # tests/test_supply_chain.py holds that command to the identity it ought to pin.
      - name: Verify the signature as a deployer would
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/image.yml@${REF}" \
            > /dev/null

      # Scanned from the registry by digest, so the SBOM describes exactly what was pushed rather
      # than a local image that merely shares its tag.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}@${DIGEST}" -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Report what was signed
        run: |
          {
            echo "### Signed and attested"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify before deploying with the \`cosign verify\` command in docs/deploying.md."
          } >> "$GITHUB_STEP_SUMMARY"
