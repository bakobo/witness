# fail2ban jail: repeated 4xx per client at a Caddy edge. Pairs with filter.d/caddy-4xx.conf.
#
# Generic by design, and meant to be copied verbatim. What a particular host must add -- the
# operator addresses to ignore, which of the distribution's own jails to keep -- belongs in a
# separate jail.d/*.local file, which fail2ban reads after this one.

[caddy-4xx]
enabled = true
filter = caddy-4xx

# Caddy logs to stderr and systemd puts it in the journal; there is no file to tail or rotate.
backend = systemd

# Ten counted responses inside ten minutes. Chosen from thirty days of four public KERI witnesses'
# logs: every source that reached it was a scanner, many of them bursting to several hundred, while
# the busiest legitimate callers -- a crawler, an operator testing by hand -- stayed at six.
maxretry = 10
findtime = 10m

# An hour for a first offence, doubling for each repeat up to a day. A day rather than a week
# because cloud addresses are recycled quickly and the next holder of a scanner's address is
# usually somebody else. Repeat offenders are tracked in fail2ban's own database, which is why
# there is no recidive jail reading fail2ban's log file.
bantime = 1h
bantime.increment = true
bantime.factor = 1
bantime.maxtime = 24h

# Ban in nftables, in fail2ban's own `inet f2b-table`, and ONLY on the HTTP ports. The port scope
# is what makes SSH unbannable for every address, rather than for the addresses somebody
# remembered to list. A table of its own means neither fail2ban nor any other ruleset owner
# flushes the other's rules.
#
# UDP AS WELL AS TCP, because Caddy serves HTTP/3 over QUIC on UDP 443 by default and advertises
# it in Alt-Svc on every response. A TCP-only ban leaves a banned client free to carry on over
# HTTP/3 wherever the firewall in front admits UDP 443.
#
# ONE RULE FOR BOTH, not `nftables-multiport` with `protocol = tcp,udp`. That type adds a rule per
# protocol in a shell loop whose exit status is the last iteration's, so a failed TCP add followed
# by a good UDP one reports success, and the action check then finds the UDP rule and agrees. A
# single `meta l4proto` rule is one command: it is added whole or the jail fails to start.
action = nftables[type=custom, rule_match-custom="meta l4proto \{ tcp, udp \} th dport \{ 80, 443 \}"]
