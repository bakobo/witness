# fail2ban filter: repeated 4xx per client, read from Caddy's JSON access log in journald.
#
# Generic by design, and meant to be copied verbatim: it names no host, no vendor and no operator.
# It assumes only the edge it was written for -- Caddy terminates the connection itself, logs with
# `format json` to stderr under systemd, and nothing behind it trusts X-Forwarded-For.
#
# WHAT COUNTS: any 4xx from any `http.log.access*` logger, except as `exempt` and `exempt404` below say.
# 5xx never counts; that is the server's fault, not the caller's.
#
# KEYED ON remote_ip, the TCP peer, NOT client_ip. A ban is applied to the packet's source address,
# so the address it bans has to be the one the firewall sees. The two are equal while Caddy trusts
# no proxy; if a proxy is ever put in front, client_ip would name an address whose packets never
# arrive here and the ban would do nothing.
#
# A HEADER CANNOT FORGE A MATCH. Caddy JSON-escapes every request value, so the text `"status":404`
# inside a User-Agent arrives as `\"status\":404`, which the patterns below do not accept.

[Definition]

# Paths whose 4xx, of any kind, is an ordinary answer to a well-behaved client rather than evidence
# of abuse. The default is KERI's: /oobi, /receipts and /query answer 404, 406 or 400 for an
# identifier or event the service does not hold YET, and a controller polling through an inception
# produces exactly that, repeatedly. A service with different routes overrides this from its jail:
#     filter = caddy-4xx[exempt="/healthz"]
exempt = /(?:oobi|receipts|query)(?:[/?][^"]*)?

# Paths exempt from a 404 ONLY. Browsers and crawlers request these on their own initiative and
# most services have neither; any other 4xx on them -- a 413 from an oversized body, say -- counts.
exempt404 = /(?:favicon\.ico|robots\.txt)(?:\?[^"]*)?

# The access logger, then the peer as the first field of the request object, then a 4xx status.
# The status is pinned to the field Caddy writes immediately before `resp_headers` -- true of all
# 147,982 access lines in the capture this was tested on -- so no other numeric field named status,
# should a later Caddy add one, can stand in for the response's.
failregex = "logger":"http\.log\.access(?:\.[^"]*)?",.*?"request":\{"remote_ip":"<ADDR>",.*"status":4\d\d,"resp_headers":

# A line whose URI is in `exempt`, or in `exempt404` with a 404, is dropped even though it matched.
# Only the fields that precede `uri` in Caddy's request object are skipped, each as a complete JSON
# string, so a value containing escaped quotes cannot shift where `uri` is found.
ignoreregex = "request":\{(?:"[a-z_]+":"(?:[^"\\]|\\.)*",)*?"uri":"(?:<exempt>)"
              "request":\{(?:"[a-z_]+":"(?:[^"\\]|\\.)*",)*?"uri":"(?:<exempt404>)".*"status":404,"resp_headers":

# The systemd unit Caddy's own package installs. A deployment that runs Caddy elsewhere -- in a
# container logging through Docker's journald driver, say -- overrides this in its jail.
journalmatch = _SYSTEMD_UNIT=caddy.service
