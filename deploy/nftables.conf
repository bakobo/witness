#!/usr/sbin/nft -f
# Per-source volumetric limits for a public witness. Reference deployment kit; see README.md.
#
# Install as /etc/nftables.d/witness.nft, include it from /etc/nftables.conf so boot loads it
# before Docker starts, and apply it live with `nft -f /etc/nftables.d/witness.nft` (README.md).
# NEVER `systemctl reload nftables` on a host running Docker: it runs /etc/nftables.conf, whose
# `flush ruleset` removes Docker's chains and NAT rules too, and the witness container loses its
# outbound connectivity until `systemctl restart docker`.
#
# IT BOUNDS CONNECTIONS, NOT REQUESTS. nftables sees packets and conntrack entries, and HTTP/2
# multiplexes many requests over one connection, so a client that opens one connection and sends
# ten thousand requests passes every rule here. This absorbs connection floods and scrapers in the
# kernel, and that is the whole claim. Requests are the witness's and fail2ban's business.
#
# IT HOOKS INPUT, NOT DOCKER-USER. Public traffic terminates at Caddy, a host process, and the
# witness container publishes only to 127.0.0.1, so public packets arrive over input and never
# traverse Docker's chains. Rules in DOCKER-USER would be configured and inert.
#
# The numbers are chosen, not measured against a busy controller: far above what a controller
# designating a witness does (a handful of requests over one or two connections) and far below a
# flood. Revise them from your own access log once real traffic exists.

# An atomic replace of this table and nothing else. `nft -f` is additive, so loading a file that
# declares an existing table appends duplicate rules, and the lower of two thresholds silently
# binds. Declaring the table empty, deleting it, then declaring it for real happens in one
# transaction; the empty declaration makes the delete safe on first load.
table inet witness {}
delete table inet witness

# A table of its own rather than rules in `filter`, where Docker's live, so neither flushes the
# other, and `nft delete table inet witness` is a complete uninstall. `inet` covers IPv4 and IPv6:
# a v4-only ruleset leaves the v6 path as the obvious way around every number below.
table inet witness {

    # Per-source state. A meter is what makes the limits PER SOURCE: without one, one flood spends
    # the budget for every client at once. Sized and timed out, because an unbounded set is memory
    # an attacker chooses the size of.
    set flood_rate {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1m
        size 65535
    }

    set flood_rate6 {
        type ipv6_addr
        flags dynamic, timeout
        timeout 1m
        size 65535
    }

    # No timeout on the count sets: the kernel refuses one on a set used by `ct count`, and none is
    # needed, because an element is reaped when the source's last connection closes.
    set conn_count {
        type ipv4_addr
        flags dynamic
        size 65535
    }

    set conn_count6 {
        type ipv6_addr
        flags dynamic
        size 65535
    }

    chain input {
        # Ahead of the filter priority, so these run before Docker's and the distribution's rules.
        # Policy accept: this chain drops only what it decides to and is not a host firewall.
        # Which ports are open at all is still your firewall's decision.
        type filter hook input priority filter - 10; policy accept;

        # Established traffic is never limited; the limits are on starting and holding connections.
        ct state established,related accept

        # Loopback first. Caddy reaches the witness over 127.0.0.1 and the control plane listens
        # there; a rule that caught either would look like the witness failing.
        iif lo accept

        # SSH is accepted before any limit and never counted. It is the administrative path, and
        # a limit on it is a lockout waiting for a bad afternoon. Change the port if yours differs.
        tcp dport 22 accept

        # Port 80 exists for the ACME challenge and the HTTPS redirect, 443 for the witness. Both
        # are limited, because a flood does not care what a port is for.
        #
        # Count first, then rate. They bound different things: a source can stay under the rate
        # while accumulating open connections, and can churn connections below the count as fast
        # as it likes. `over` matches when the limit is EXCEEDED, so these drop the excess.
        #
        # The rate counts packets, not connections: a dropped SYN is retransmitted and charged
        # again, so under loss the effective connection limit falls below 25/s. That is the safe
        # direction. The burst of 60 is what keeps a client opening several connections at once
        # from ever being throttled.
        tcp dport 80 ct state new add @conn_count { ip saddr ct count over 64 } counter drop
        tcp dport 80 ct state new add @conn_count6 { ip6 saddr ct count over 64 } counter drop
        tcp dport 80 ct state new add @flood_rate { ip saddr limit rate over 25/second burst 60 packets } counter drop
        tcp dport 80 ct state new add @flood_rate6 { ip6 saddr limit rate over 25/second burst 60 packets } counter drop

        tcp dport 443 ct state new add @conn_count { ip saddr ct count over 64 } counter drop
        tcp dport 443 ct state new add @conn_count6 { ip6 saddr ct count over 64 } counter drop
        tcp dport 443 ct state new add @flood_rate { ip saddr limit rate over 25/second burst 60 packets } counter drop
        tcp dport 443 ct state new add @flood_rate6 { ip6 saddr limit rate over 25/second burst 60 packets } counter drop
    }
}
