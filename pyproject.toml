[project]
name = "witness"
version = "0.2.0"
description = "Bakobo's operator layer over a stock keripy witness — observe a running witness without forking keripy."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
dependencies = [
    # Public, so plain HTTPS resolves it anonymously — for anyone, with or without a Bakobo
    # account. That is now true of the whole closure (@qojsxe7s); heti was the one exception.
    # A FORK-ONLY pin: 173678c0 sits on bakobo/keripy's feature/witness-decls, which upstream has
    # not taken. @enyp5khx permits that only while an open upstream PR carries the commit home,
    # and keripy-drift.yml fails the week that stops being true. Full 40-char SHA, like fiki's
    # below: a short ref is ambiguous by construction, and the canary parses this line.
    "keri @ git+https://github.com/bakobo/keripy@173678c0bad44203609942fd9b52134453f0d936",
    "falcon",
    "waitress",
    # ops.md §7 mandates the OpenTelemetry SDK in code Bakobo writes, with OTLP on the wire
    # (@wea6qjmk). Both live only in the control-plane process, which @c7v3kp already establishes
    # cannot affect the witness, and export stays off unless a collector endpoint is configured.
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # The RFC 9421 verifier @s6v3qm rides. It is a DEV dependency and not a runtime one because
    # the auth path it serves has not landed: nothing under src/ imports fiki, and declaring a
    # runtime dependency the package never imports would be a claim the code does not support.
    # tests/test_fiki_contract.py holds the shape witness will call, so the assumptions are
    # already under test when the auth work starts; move this line into `dependencies` then.
    # Pinned at the py/v0.5.0 tag rather than main: that commit is the released Python artifact.
    "fiki @ git+https://github.com/bakobo/fiki@f1c8999bd78d9fee7661672c92a9931fae9ab6f1#subdirectory=py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# witness pins keripy to a git commit; hatchling needs this to allow the direct reference.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=witness --cov-branch --cov-report=term-missing --cov-fail-under=100"
# @enyp5khx. CI runs everything against the pin, where these pass. The drift canary runs against
# upstream keripy, where they cannot, so it deselects them — and separately runs ONLY them, to
# learn whether the feature has landed upstream yet. Both directions read this one marker.
markers = [
    "fork_only_keripy: needs keripy code that exists only on the bakobo fork, not upstream",
]

[tool.coverage.run]
branch = true
source = ["witness"]
