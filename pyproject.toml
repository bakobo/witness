[project]
name = "witness"
version = "0.1.0"
description = "Bakobo's operator layer over a stock keripy witness — observe a running witness without forking keripy."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
dependencies = [
    "keri @ git+https://github.com/bakobo/keripy@366d81071aea7be5b8ad35acbed815e1255224d5",
    # heti pins the same keri commit (f5j3wc); the two must never diverge or `keri` cannot resolve.
    # SSH because heti is private and every Bakobo developer already has SSH keys, so a fresh
    # clone needs no credential setup. CI has no SSH key and instead rewrites this to an HTTPS
    # URL carrying a GitHub App token (.github/workflows/ci.yml). keripy stays HTTPS: it is
    # public, so anonymous HTTPS resolves it for anyone, with or without a Bakobo account.
    "heti @ git+ssh://git@github.com/bakobo/heti@cd83690286c47241460fa6e2dc81a59abb452d16",
    "falcon",
    "waitress",
    # ops.md §7 mandates the OpenTelemetry SDK in code Bakobo writes, with OTLP on the wire
    # (@wea6qjmk). Both live only in the control-plane process, which @c7v3kp already establishes
    # cannot affect the witness, and export stays off unless a collector endpoint is configured.
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# witness pins keripy to a git commit; hatchling needs this to allow the direct reference.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=witness --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["witness"]
